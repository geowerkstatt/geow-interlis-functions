name: Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push branch image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        java-version: 8
        distribution: adopt
        cache: gradle

    - name: Get image tag from branch name
      id: image
      run: echo "tag=${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

    - name: Build jar with Gradle
      run: ./gradlew -Pversion="$IMAGE_TAG" jar
      env:
        IMAGE_TAG: ${{ steps.image.outputs.tag }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push plugin image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        build-args: VERSION=${{ steps.image.outputs.tag }}
        tags: ghcr.io/geowerkstatt/geow-interlis-functions:${{ steps.image.outputs.tag }}
